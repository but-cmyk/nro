name: CI Build & Automated Test Suites

on:
  push:
    branches: [main, fix/security-p0]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build server JAR (Maven)
        run: mvn -B -ntp package

      - name: Run Automated Test Suites & Guardrails
        run: |
          chmod +x tools/scripts/run_all_tests.sh
          ./tools/scripts/run_all_tests.sh

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
