services:
  # MySQL Database Service (Tự động khởi tạo nro_data)
  mysql:
    image: mysql:8.0
    container_name: nro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_strong_password}
      MYSQL_DATABASE: ${DATABASE_NAME:-nro_data}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=512M
      - --innodb-log-buffer-size=16M
      - --max-connections=200
      - --wait-timeout=28800
      - --interactive-timeout=28800
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: nro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NRO Backend Game Server
  nro_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nro_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-mysql}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_NAME=${DATABASE_NAME:-nro_data}
      - DATABASE_USER=${DATABASE_USER:-root}
      - DATABASE_PASS=${DATABASE_PASS:-change_me_strong_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - NRO_ADMIN_TOKEN=${NRO_ADMIN_TOKEN:-}
      - NRO_CORS_ORIGIN=${NRO_CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "14445:14445"
      - "14446:14446"
    volumes:
      - ./data:/app/data
    mem_limit: 1280m

volumes:
  mysql_data:
  redis_data:
